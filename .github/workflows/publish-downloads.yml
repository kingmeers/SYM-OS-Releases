name: Publish verified Sym downloads
on:
  push:
    branches: [main]
    paths:
      - releases.json
      - release-approvals/**
      - release-evidence/**
      - .github/workflows/publish-downloads.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      recover_version:
        description: 'Explicit preview recovery only: already-approved selected version'
        required: false
        type: string
      recover_expected_sha256:
        description: 'Frozen current preview channel SHA256; never refreshed automatically'
        required: false
        type: string
  # Reconcile missed events, including releases created using GITHUB_TOKEN.
  # Matching approved selections are no-ops: no repeated installer transfer.
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: sym-downloads-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishing and promotion each verify public installer bytes. Mixed-platform
    # preview selections can exceed 45 minutes; retain every integrity check.
    timeout-minutes: 120
    environment: sym-publisher-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          path: archive
          persist-credentials: false
      - name: Checkout reviewed private publisher using read-only deploy key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Doghouse-Labs-inc/sym-ai-downloads-proxy
          ref: 5789a3f416bce1d37c6ea0a037439b6293645e09
          path: publisher
          fetch-depth: 0
          ssh-key: ${{ secrets.PUBLISHER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - name: Verify publisher from clean dependencies
        working-directory: publisher
        run: npm ci --ignore-scripts && node scripts/bundle-serving.js --check && npm test
      - name: Publish approved inventory and atomically promote preview
        working-directory: archive
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          RECOVERY_VERSION: ${{ inputs.recover_version }}
          RECOVERY_EXPECTED: ${{ inputs.recover_expected_sha256 }}
        run: |
          if [ -n "$RECOVERY_VERSION$RECOVERY_EXPECTED" ]; then
            mkdir -p receipts
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import { main } from '../publisher/scripts/publish.js';
          import { Store, credentials } from '../publisher/scripts/store.js';
          const version = process.env.RECOVERY_VERSION;
          const expected = process.env.RECOVERY_EXPECTED;
          assert(/^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$/.test(version || ''), 'Explicit valid recovery version required');
          assert(/^[a-f0-9]{64}$/.test(expected || ''), 'Explicit frozen channel SHA256 required');
          const catalog = JSON.parse(await fs.readFile('releases.json', 'utf8'));
          const approval = JSON.parse(await fs.readFile(`release-approvals/${version}.json`, 'utf8'));
          assert(catalog.latest.preview === version && catalog.latest.windows_preview === version, 'Recovery must match the reviewed current preview selections');
          assert(approval.finalized === true && approval.nativeAcceptance === true && approval.release.version === version, 'Recovery requires existing finalized native acceptance');
          const store = new Store(credentials());
          const current = await store.json('channels/preview.json');
          assert(current?.sha256 === expected, 'Current channel differs from frozen recovery expectation');
          const prior = await store.json(`control/operations/preview/${expected}.json`);
          const verified = await store.json(`control/verified-operations/preview/${expected}.json`);
          const alreadyVerified = verified?.value?.committed === true && verified.value.verified === true && verified.value.nextSha256 === expected;
          await fs.writeFile('receipts/recovery-inspection.json', JSON.stringify({ expected, currentSha256: current.sha256, priorOperation: prior?.value, alreadyVerified }, null, 2));
          // Existing publisher performs full verification and exact-ETag CAS.
          // It does not refresh expected state, overwrite assets, or auto-rollback.
          if (!alreadyVerified) {
            assert(prior?.value?.committed === true && prior.value.nextSha256 === expected, 'Missing matching committed-operation receipt');
            await main(['promote', '--version', version, '--channel', 'preview', '--expected', expected, '--aliases', `release-approvals/${version}.aliases.json`, '--receipt', 'receipts/explicit-preview-recovery.json']);
          }
          NODE
          fi
          node ../publisher/scripts/sync-approved.js
      - name: Keep sanitized operation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: downloads-publication-${{ github.run_id }}
          path: archive/receipts/
          retention-days: 14
          if-no-files-found: warn
